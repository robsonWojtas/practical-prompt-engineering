<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A simple local prompt library for saving reusable prompts."
    />
    <title>Prompt Library</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <p class="eyebrow">Developer toolkit</p>
        <h1>Prompt Library<span aria-hidden="true">_</span></h1>
        <p>Save your most useful prompts, rate their effectiveness, and keep notes close at hand.</p>
      </header>

      <section class="panel" aria-labelledby="new-prompt-heading">
        <h2 id="new-prompt-heading">New prompt</h2>

        <form id="prompt-form">
          <div class="form-field">
            <label for="prompt-title">Title</label>
            <input
              id="prompt-title"
              name="title"
              type="text"
              placeholder="e.g. Explain a code snippet"
              required
            />
          </div>

          <div class="form-field">
            <label for="prompt-content">Prompt content</label>
            <textarea
              id="prompt-content"
              name="content"
              rows="7"
              placeholder="Write your prompt here..."
              required
            ></textarea>
          </div>

          <div class="form-field">
            <label for="prompt-model">Model name</label>
            <input id="prompt-model" name="model" type="text" maxlength="100"
              placeholder="Enter any model name" required />
          </div>
          <label class="checkbox-field" for="prompt-is-code">
            <input id="prompt-is-code" name="isCode" type="checkbox" />
            Prompt contains code (adjust token estimate)
          </label>
          <button class="save-button" type="submit">Save prompt</button>
        </form>
      </section>

      <section class="library" aria-labelledby="saved-prompts-heading">
        <h2 id="saved-prompts-heading">Saved prompts</h2>
        <p class="library-hint">Newest first · Dates shown in your local time</p>
        <p id="app-error" class="app-error" role="alert" hidden></p>
        <div id="prompt-list" class="prompt-grid"></div>
      </section>
    </main>

    <script src="metadata.js"></script>
    <script src="script.js"></script>
  </body>
</html>
